name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: read
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4 # pin
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2 # pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4 # pin
      - uses: github/codeql-action/init@v3 # pin
        if: hashFiles({{CODEQL_GLOB}}) != ''
        with:
          languages: {{CODEQL_LANG}}
      - uses: github/codeql-action/analyze@v3 # pin
        if: hashFiles({{CODEQL_GLOB}}) != ''
