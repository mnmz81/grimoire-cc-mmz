name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Catalog in sync with plugin.json manifests
        run: python3 scripts/generate-catalog.py --check

      - name: SKILL.md frontmatter is strict YAML
        run: python3 scripts/check-frontmatter.py

      - name: Shellcheck vendored scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck plugins/debugging/scripts/open-audit-issues.sh plugins/repo-init/scripts/repo-init.sh \
            install.sh tests/install_test.sh scripts/check-skills-cli.sh

      - name: install.sh tests
        run: tests/install_test.sh

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: npx skills discovers every skill
        run: scripts/check-skills-cli.sh

      # `claude plugin validate` runs when the CLI is available in CI; the catalog
      # drift gate above is the always-on check that needs no external tooling.
      - name: Validate plugins (if Claude CLI present)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not installed in CI runner — skipping plugin validate."
          fi
